<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IFC 賃貸経営 かんたん診断｜無料相談</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Noto Sans JP",sans-serif;background:#f1f3f7;color:#1f2a3c;padding:24px 16px 48px}
  .head{text-align:center;margin-bottom:24px}
  .head .logo{font-weight:700;font-size:22px;color:#1e3a6e;letter-spacing:.06em;margin-right:8px}
  .head .sub{font-size:13px;color:#5b6475}
  .card{max-width:620px;margin:0 auto;background:#fff;border:1px solid #dde2ea;border-radius:12px;padding:32px 28px}
  h1{text-align:center;font-size:22px;font-weight:700}
  h1 em{font-style:normal;color:#1e3a8a}
  .lead{text-align:center;font-size:13px;color:#5b6475;margin-top:6px}
  .merit{display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fcf1e2;border-radius:8px;padding:20px 24px;margin-top:24px}
  .merit h2{font-size:15px;color:#1e3a6e;margin-bottom:10px}
  .merit li{list-style:none;font-size:13px;line-height:2.1;padding-left:22px;position:relative}
  .merit li::before{content:"";position:absolute;left:3px;top:9px;width:9px;height:5px;border-left:2px solid #1e3a6e;border-bottom:2px solid #1e3a6e;transform:rotate(-45deg)}
  #operator-img{width:120px;height:auto;flex-shrink:0}
  .btn-main{display:flex;align-items:center;justify-content:center;position:relative;margin-top:22px;height:64px;background:#f27330;color:#fff;font-size:18px;font-weight:700;border-radius:6px;text-decoration:none;box-shadow:0 6px 16px rgba(242,115,48,.3)}
  .btn-main::after{content:"›";position:absolute;right:22px;font-size:22px}
  .btn-row{display:flex;gap:12px;margin-top:12px}
  .btn-sub{flex:1;display:flex;align-items:center;justify-content:center;height:50px;border:1px solid #b9c2d3;border-radius:4px;color:#1f2a3c;font-size:14px;font-weight:700;text-decoration:none;background:#fff}
  .tel{background:#f1f3f7;border-radius:8px;text-align:center;padding:20px;margin-top:22px}
  .tel p{font-size:13px;font-weight:700}
  .tel .num{font-size:28px;font-weight:700;margin:6px 0 2px;color:#1f2a3c;text-decoration:none;display:inline-block}
  .tel .num::before{content:"☎";color:#1e3a6e;margin-right:8px;font-size:22px}
  .tel small{font-size:11px;color:#5b6475}
  .btn-back{margin-top:22px}
  @media (max-width:520px){.btn-row{flex-direction:column}#operator-img{width:90px}.merit{padding:18px 16px}}
</style>
</head>
<body>
  <div class="head"><span class="logo">IFC</span><span class="sub">賃貸経営 かんたん診断（約1分）</span></div>
  <div class="card">
    <h1>まずは<em>無料相談</em>からはじめませんか？</h1>
    <p class="lead">オーナー様の状況に合わせて、最適なプランをご提案します。</p>

    <div class="merit">
      <div>
        <h2>無料相談でできること</h2>
        <ul>
          <li>現状の管理状況の確認・課題の整理</li>
          <li>収益改善のためのアドバイス</li>
          <li>管理プラン・見積りのご提案</li>
          <li>管理会社変更の進め方のご説明</li>
        </ul>
      </div>
      <!-- オペレーター画像（下のscriptで3枚からランダム表示） -->
      <img id="operator-img" src="images/operator-a.png" alt="オペレーター">
    </div>

    <a class="btn-main" href="#">無料相談を申し込む</a>
    <div class="btn-row">
      <a class="btn-sub" href="#">無料ダブル査定を依頼する</a>
      <a class="btn-sub" href="#">資料をダウンロードする</a>
    </div>

    <div class="tel">
      <p>お急ぎの方はお電話でもご相談いただけます</p>
      <a class="num" href="tel:0357755678">03-5775-5678</a><br>
      <small>受付時間 9:00〜18:00（定休日：水曜・日曜）</small>
    </div>

    <a class="btn-sub btn-back" href="#">結果に戻る</a>
  </div>

<script>
  // ページを開くたびに3枚の中から1枚をランダムで表示
  const operators = [
    "images/operator-a.png",
    "images/operator-b.png",
    "images/operator-c.png"
  ];
  const pick = operators[Math.floor(Math.random() * operators.length)];
  document.getElementById("operator-img").src = pick;
</script>
</body>
</html>
